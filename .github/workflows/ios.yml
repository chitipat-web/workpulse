name: Build iOS app (TestFlight)

# กดรันเองจากแท็บ Actions เมื่อใส่ secrets ครบ:
#   ASC_KEY_ID     — Key ID ของ App Store Connect API key
#   ASC_ISSUER_ID  — Issuer ID
#   ASC_KEY_P8     — เนื้อหาไฟล์ .p8 ทั้งไฟล์
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select latest Xcode (Apple requires iOS 26 SDK for uploads)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare web assets
        run: |
          cd app
          npm ci
          cp ../map.html www/index.html
          npx cap sync ios

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      - name: Build & upload to TestFlight (fastlane)
        run: |
          cd app/ios/App
          pod install
          fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
