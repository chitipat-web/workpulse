<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>แผนที่โลก 3D — Royal Lala</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090f">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#09090f;
    --gold:#c9aa71;
    --gold-dim:rgba(201,170,113,.35);
    --text:#e8dcc8;
    --text2:#9a8f7a;
    --panel:rgba(13,13,20,.88);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Prompt','Sarabun',sans-serif;color:var(--text)}
  #map{position:absolute;inset:0}

  /* ===== Top bar ===== */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:linear-gradient(180deg,rgba(9,9,15,.92),rgba(9,9,15,0));
    pointer-events:none;
  }
  .topbar>*{pointer-events:auto}
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--gold-dim);color:var(--text);
    font-family:inherit;font-size:14px;font-weight:500;
    padding:8px 14px;border-radius:22px;cursor:pointer;
    backdrop-filter:blur(8px);text-decoration:none;
  }
  .back-btn:active{transform:scale(.96)}
  .title{
    font-size:16px;font-weight:600;letter-spacing:.3px;
    text-shadow:0 1px 6px rgba(0,0,0,.8);
  }
  .title small{display:block;font-size:11px;font-weight:400;color:var(--text2);letter-spacing:1.5px}

  /* ===== Action buttons (left side, ใต้ปุ่มกลับ) ===== */
  .actions{
    position:absolute;left:10px;top:calc(70px + env(safe-area-inset-top));z-index:10;
    display:flex;flex-direction:column;gap:8px;
  }
  .act-btn{
    width:44px;height:44px;border-radius:12px;
    background:var(--panel);border:1px solid var(--gold-dim);color:var(--text);
    font-size:19px;cursor:pointer;backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s;
  }
  .act-btn.on{background:rgba(201,170,113,.25);border-color:var(--gold);color:var(--gold)}
  .act-btn img{width:30px;height:30px;border-radius:50%;object-fit:cover}
  .act-btn.rec{background:rgba(255,91,110,.22);border-color:#ff5b6e;animation:recblink 1.6s infinite}
  @keyframes recblink{50%{box-shadow:0 0 12px rgba(255,91,110,.65)}}
  .act-btn:active{transform:scale(.94)}

  /* ===== แผงประวัติการเดินทาง ===== */
  .hist-panel{
    position:absolute;left:0;right:0;bottom:0;z-index:16;
    background:#101018;border:1px solid var(--gold-dim);border-bottom:none;
    border-radius:18px 18px 0 0;max-height:62vh;overflow-y:auto;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .3s;
  }
  .hist-panel.open{transform:none}
  .hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .hist-head b{font-size:15px;color:var(--gold)}
  .hist-head button{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:4px 8px}
  .hist-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid rgba(201,170,113,.12)}
  .hist-info{flex:1;display:flex;flex-direction:column;gap:2px;cursor:pointer}
  .hist-info b{font-size:14px;font-weight:500}
  .hist-info span{font-size:12px;color:var(--text2)}
  .hist-del{background:none;border:none;font-size:16px;cursor:pointer;opacity:.7;padding:6px}
  .hist-empty{color:var(--text2);font-size:13px;text-align:center;padding:20px 0}
  .cp-p{font-size:13px;color:var(--text2);line-height:1.7;margin:6px 0}
  .cp-btn{
    width:100%;padding:13px 14px;border-radius:12px;cursor:pointer;text-align:left;
    border:1px solid var(--gold-dim);background:rgba(201,170,113,.1);color:var(--text);
    font-family:inherit;font-size:14px;margin-top:8px;
  }
  .cp-btn:active{transform:scale(.98)}
  .sync-code{
    font-size:30px;font-weight:700;letter-spacing:6px;color:var(--gold);text-align:center;
    padding:12px;background:#09090f;border:1px dashed var(--gold);border-radius:12px;margin:8px 0;
    font-family:'JetBrains Mono',monospace;
  }

  /* ===== City chips (bottom) ===== */
  .chips{
    position:absolute;left:0;right:0;bottom:0;z-index:10;
    display:flex;gap:8px;overflow-x:auto;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(9,9,15,.9),rgba(9,9,15,0));
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--gold-dim);color:var(--text);
    font-family:inherit;font-size:13px;font-weight:500;
    padding:9px 16px;border-radius:22px;cursor:pointer;
    backdrop-filter:blur(8px);white-space:nowrap;
    transition:background .15s,border-color .15s;
  }
  .chip.active{background:rgba(201,170,113,.25);border-color:var(--gold);color:var(--gold)}
  .chip:active{transform:scale(.95)}

  /* ===== จุดตำแหน่งฉัน (GPS) ===== */
  .me-dot{
    width:18px;height:18px;border-radius:50%;
    background:#3d8bff;border:3px solid #fff;
    box-shadow:0 0 0 0 rgba(61,139,255,.55);
    animation:mepulse 2s ease-out infinite;
  }
  @keyframes mepulse{
    0%{box-shadow:0 0 0 0 rgba(61,139,255,.55)}
    100%{box-shadow:0 0 0 20px rgba(61,139,255,0)}
  }

  /* ===== Hint toast ===== */
  .hint{
    position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));z-index:10;
    transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--gold-dim);
    color:var(--text2);font-size:12px;
    padding:8px 16px;border-radius:18px;backdrop-filter:blur(8px);
    white-space:nowrap;opacity:1;transition:opacity .6s;pointer-events:none;
  }
  .hint.hide{opacity:0}

  /* ===== Loading overlay ===== */
  .loading{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--bg);transition:opacity .5s;
  }
  .loading.hide{opacity:0;pointer-events:none}
  .loading .globe{font-size:52px;animation:spin 2.5s linear infinite}
  .loading p{color:var(--text2);font-size:14px}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* MapLibre controls — ปรับให้เข้าธีมมืด + เลื่อนลงพ้น topbar */
  .maplibregl-ctrl-top-right{top:calc(58px + env(safe-area-inset-top))}
  .maplibregl-ctrl-group{background:var(--panel)!important;backdrop-filter:blur(8px);border:1px solid var(--gold-dim)}
  .maplibregl-ctrl-group button{filter:invert(.85)}
  .maplibregl-ctrl-attrib{background:rgba(9,9,15,.6)!important;color:var(--text2)!important;font-size:10px}
  .maplibregl-ctrl-attrib a{color:var(--text2)!important}
</style>
</head>
<body>

<div id="map"></div>

<div class="loading" id="loading">
  <div class="globe">🌍</div>
  <p id="loadingMsg">กำลังโหลดแผนที่โลก 3D...</p>
  <p style="position:absolute;bottom:14px;right:16px;font-size:10px;color:#3a3a4a">v14</p>
</div>

<div class="topbar">
  <a class="back-btn" href="casino.html">←</a>
  <div class="title">🌍 แผนที่โลก 3D<small>REAL WORLD · 3D BUILDINGS</small></div>
</div>

<div class="actions">
  <button class="act-btn" id="btnLogin" onclick="openCloudPanel()" title="ซิงก์เส้นทางข้ามเครื่อง">👤</button>
  <button class="act-btn" id="btnFollow" onclick="toggleFollow()" title="ตามตำแหน่ง GPS ของฉัน">🧭</button>
  <button class="act-btn" id="btnRec" onclick="toggleRec()" title="บันทึกการเดินทางวันนี้">⏺</button>
  <button class="act-btn" id="btnHist" onclick="toggleHist()" title="ประวัติการเดินทาง">📅</button>
  <button class="act-btn on" id="btn3d" onclick="toggle3D()" title="สลับมุมมอง 2D / 3D">🏙️</button>
  <button class="act-btn" id="btnGlobe" onclick="goGlobe()" title="กลับไปดูลูกโลก">🌐</button>
  <button class="act-btn" id="btnSat" onclick="toggleSat()" title="ภาพถ่ายดาวเทียม + ภูเขา 3D">🛰️</button>
  <button class="act-btn" onclick="location.href='map-real.html'" title="โหมดภาพถ่ายเสมือนจริง (Google 3D)">🌆</button>
</div>

<div class="hist-panel" id="histPanel">
  <div class="hist-head"><b>📅 การเดินทางของฉัน</b><button onclick="toggleHist()">✕</button></div>
  <div id="histList"></div>
</div>

<div class="hist-panel" id="cloudPanel">
  <div class="hist-head"><b>☁️ ซิงก์ข้ามเครื่อง</b><button onclick="closeCloudPanel()">✕</button></div>
  <div id="cloudBody"></div>
</div>

<div class="hint" id="hint">ลาก 2 นิ้ว (หรือคลิกขวา) เพื่อหมุน/เอียงมุมมอง</div>

<div class="chips" id="chips"></div>

<script>
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingMsg');
function hideLoading() { loadingEl.classList.add('hide'); }
function showFail(html) {
  loadingEl.classList.remove('hide');
  loadingEl.querySelector('.globe').style.animation = 'none';
  loadingMsg.innerHTML = html +
    '<br><small style="font-size:9px;color:#555;word-break:break-all">' + navigator.userAgent.slice(0, 130) + '</small>';
}

// จับ error ทุกชนิดขึ้นจอ — ห้ามค้างเงียบ ๆ เด็ดขาด
window.addEventListener('error', e => {
  if (!loadingEl.classList.contains('hide')) {
    showFail('เกิดข้อผิดพลาด 😢 ลองรีเฟรชใหม่<br><small style="font-size:10px;color:#888;word-break:break-all">' +
      (e.message || 'unknown') + '<br>' + ((e.filename || '').split('/').pop()) + ':' + (e.lineno || '?') + '</small>');
  }
});
window.addEventListener('unhandledrejection', e => {
  if (!loadingEl.classList.contains('hide')) {
    showFail('เกิดข้อผิดพลาด 😢 ลองรีเฟรชใหม่<br><small style="font-size:10px;color:#888;word-break:break-all">' +
      ((e.reason && e.reason.message) || e.reason || 'unknown') + '</small>');
  }
});

// กันค้าง: ถ้าผ่านไป 15 วิแล้วยังไม่ขึ้นแผนที่ ให้แจ้งผู้ใช้
setTimeout(() => {
  if (!loadingEl.classList.contains('hide')) {
    showFail('โหลดช้าผิดปกติ — เน็ตอาจอ่อน 📶<br>ลองรีเฟรชหน้านี้อีกครั้ง');
  }
}, 15000);

// ไลบรารีแผนที่โหลดไม่ขึ้น (เน็ตหลุด / CDN ล่ม)
if (typeof maplibregl === 'undefined') {
  showFail('โหลดตัวแผนที่ไม่สำเร็จ 😢<br>เช็คอินเทอร์เน็ตแล้วลองรีเฟรชใหม่');
  throw new Error('maplibre-gl failed to load');
}

// อุปกรณ์ไม่รองรับ WebGL2 (เช่น เปิด Lockdown Mode บน iPhone)
if (!document.createElement('canvas').getContext('webgl2')) {
  showFail('เบราว์เซอร์นี้ไม่รองรับ WebGL2 ที่ใช้วาดแผนที่ 3D 😢<br>' +
    '<small style="font-size:11px;color:#888">ถ้าใช้ iPhone ลองปิด Lockdown Mode หรือเปิดด้วยเบราว์เซอร์อื่น</small>');
  throw new Error('WebGL2 not supported');
}

// ===== เมืองตัวอย่าง — จุดที่มีตึก 3D สวย ๆ =====
const CITIES = [
  { name: '🇹🇭 กรุงเทพฯ',  center: [100.5390, 13.7263], zoom: 15.8, bearing: -30 }, // สาทร-สีลม
  { name: '🇯🇵 โตเกียว',    center: [139.7006, 35.6896], zoom: 15.8, bearing: 20 },  // ชินจูกุ
  { name: '🇺🇸 นิวยอร์ก',   center: [-73.9857, 40.7484], zoom: 15.5, bearing: -15 }, // แมนแฮตตัน
  { name: '🇦🇪 ดูไบ',       center: [55.2744, 25.1972],  zoom: 15.5, bearing: 40 },  // เบิร์จคาลิฟา
  { name: '🇫🇷 ปารีส',      center: [2.2945, 48.8584],   zoom: 15.8, bearing: 60 },  // หอไอเฟล
  { name: '🇬🇧 ลอนดอน',    center: [-0.0190, 51.5050],  zoom: 15.5, bearing: -45 }, // แคนารีวอร์ฟ
  { name: '🇸🇬 สิงคโปร์',   center: [103.8520, 1.2840],  zoom: 15.8, bearing: 0 },   // มารีนาเบย์
  { name: '🇮🇱 อิสราเอล',   center: [34.7895, 32.0742],  zoom: 15.5, bearing: -20 }, // เทลอาวีฟ (Azrieli)
  // ภูเขา — เปิดโหมดดาวเทียม + ภูมิประเทศ 3D อัตโนมัติ
  { name: '🏔️ แมทเทอร์ฮอร์น', center: [7.6859, 45.9929], zoom: 12.3, bearing: 205, pitch: 72, sat: true },
  { name: '🇹🇭 ดอยอินทนนท์',  center: [98.5300, 18.5700], zoom: 11.8, bearing: -60, pitch: 70, sat: true },
];

let map;
try {
  map = new maplibregl.Map({
    container: 'map',
    // OpenFreeMap — แผนที่โลกจริงจาก OpenStreetMap, ฟรี ไม่ต้องใช้ API key
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [100.5018, 13.7563],
    zoom: 1.6,
    pitch: 0,
    bearing: 0,
    maxPitch: 75,
    hash: true,
    attributionControl: { compact: true }
  });
} catch (err) {
  showFail('สร้างแผนที่ไม่สำเร็จ 😢<br><small style="font-size:10px;color:#888;word-break:break-all">' +
    ((err && err.message) || err) + '</small>');
  throw err;
}

map.on('error', e => {
  console.error('[map]', e.error || e);
  if (!loadingEl.classList.contains('hide') && e.error) {
    showFail('โหลดข้อมูลแผนที่ไม่สำเร็จ 😢 ลองรีเฟรชใหม่<br><small style="font-size:10px;color:#666">' +
      e.error.message + '</small>');
  }
});

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

let buildingsOn = true;

map.on('style.load', () => {
  // แต่ละส่วนพังได้โดยไม่ลากทั้งหน้าไปด้วย — globe ใช้ไม่ได้ก็ยังเหลือแผนที่แบน + ตึก 3D
  try {
    map.setProjection({ type: 'globe' });
  } catch (e) { console.warn('[globe]', e); }

  try {
    map.setSky({
      'sky-color': '#0b1530',
      'horizon-color': '#7da3cf',
      'fog-color': '#e8edf4',
      'sky-horizon-blend': 0.6,
      'horizon-fog-blend': 0.6,
      'fog-ground-blend': 0.7,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 1, 9, 0.2, 12, 0]
    });
  } catch (e) { console.warn('[sky]', e); }

  try {
    addBuildings3D();
  } catch (e) { console.warn('[3d]', e); }
});

// ===== ตึก 3D (fill-extrusion จากข้อมูลความสูงอาคาร OpenStreetMap) =====
function addBuildings3D() {
  const style = map.getStyle();

  // ลบเลเยอร์ตึก 3D เดิมของสไตล์ออกก่อน แล้วใส่ของเราที่ปรับสี/แสงเอง
  style.layers
    .filter(l => l.type === 'fill-extrusion')
    .forEach(l => map.removeLayer(l.id));

  const srcId = Object.keys(style.sources).find(k => style.sources[k].type === 'vector');
  if (!srcId) return;

  map.addLayer({
    id: 'lala-3d-buildings',
    type: 'fill-extrusion',
    source: srcId,
    'source-layer': 'building',
    minzoom: 13.5,
    paint: {
      // ตึกยิ่งสูงยิ่งเข้มไปทางสีทองตามธีมแอป
      'fill-extrusion-color': [
        'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 0],
        0,   '#e3dccb',
        40,  '#cdb88a',
        120, '#b08d52',
        300, '#8a6a38'
      ],
      // ค่อย ๆ ดันตึกขึ้นตอนซูมเข้า จะได้ไม่กระตุก
      'fill-extrusion-height': [
        'interpolate', ['linear'], ['zoom'],
        13.5, 0,
        15.5, ['coalesce', ['get', 'render_height'], 8]
      ],
      'fill-extrusion-base': [
        'interpolate', ['linear'], ['zoom'],
        13.5, 0,
        15.5, ['coalesce', ['get', 'render_min_height'], 0]
      ],
      'fill-extrusion-opacity': 0.88,
      'fill-extrusion-vertical-gradient': true
    }
  });
}

// ===== โหมดดาวเทียม: ภาพถ่ายจริง (Esri) + ภูมิประเทศ 3D (AWS Terrain) — ฟรี ไม่ใช้ key =====
let satOn = false;
function toggleSat() {
  satOn = !satOn;
  document.getElementById('btnSat').classList.toggle('on', satOn);

  if (satOn) {
    if (!map.getSource('esri-sat')) {
      map.addSource('esri-sat', {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256, maxzoom: 19,
        attribution: 'Esri, Maxar, Earthstar Geographics'
      });
    }
    if (!map.getSource('aws-terrain')) {
      map.addSource('aws-terrain', {
        type: 'raster-dem',
        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        encoding: 'terrarium', tileSize: 256, maxzoom: 13,
        attribution: 'Terrain: Mapzen/AWS'
      });
    }
    if (!map.getLayer('esri-sat')) {
      // สอดใต้เลเยอร์ตัวหนังสือ — ภาพดาวเทียมอยู่ล่าง ชื่อสถานที่ยังลอยอยู่บน
      const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol');
      map.addLayer({ id: 'esri-sat', type: 'raster', source: 'esri-sat' }, firstSymbol && firstSymbol.id);
    } else {
      map.setLayoutProperty('esri-sat', 'visibility', 'visible');
    }
    try { map.setTerrain({ source: 'aws-terrain', exaggeration: 1.15 }); } catch (e) { console.warn('[terrain]', e); }
  } else {
    if (map.getLayer('esri-sat')) map.setLayoutProperty('esri-sat', 'visibility', 'none');
    try { map.setTerrain(null); } catch (e) {}
  }
}

function toggle3D() {
  buildingsOn = !buildingsOn;
  document.getElementById('btn3d').classList.toggle('on', buildingsOn);
  if (map.getLayer('lala-3d-buildings')) {
    map.setLayoutProperty('lala-3d-buildings', 'visibility', buildingsOn ? 'visible' : 'none');
  }
  map.easeTo({ pitch: buildingsOn ? 60 : 0, duration: 800 });
}

function goGlobe() {
  stopSpin();
  stopFollow();
  setActiveChip(-1);
  map.flyTo({ center: [100.5018, 13.7563], zoom: 1.6, pitch: 0, bearing: 0, duration: 2500 });
}

// ===== ข้อความแจ้งเตือนชั่วคราว =====
const hintEl = document.getElementById('hint');
let toastTimer;
function toast(msg, ms = 4000) {
  hintEl.textContent = msg;
  hintEl.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => hintEl.classList.add('hide'), ms);

// ===== GPS: ติดตามตำแหน่ง + บันทึกการเดินทางรายวัน =====
const btnFollow = document.getElementById('btnFollow');
const btnRec = document.getElementById('btnRec');
let watchId = null;      // ยัง track ตำแหน่งอยู่ไหม
let following = false;   // กล้องล็อกตามอยู่ไหม
let meMarker = null;
let firstFix = true;

// เส้นทางเก็บในเครื่อง (localStorage) แยกตามวัน: { '2026-06-12': [[lng,lat,เวลา],...] }
const TRACKS_LS = 'lala-tracks';
let tracks = {};
try { tracks = JSON.parse(localStorage.getItem(TRACKS_LS) || '{}') || {}; } catch (e) {}
let recording = localStorage.getItem('lala-rec') === '1';
let viewDay = null; // วันที่กำลังเปิดดูย้อนหลัง (null = วันนี้แบบสด)

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function saveTracks() {
  try { localStorage.setItem(TRACKS_LS, JSON.stringify(tracks)); }
  catch (e) { toast('พื้นที่เก็บในเครื่องเต็ม — ลบเส้นทางวันเก่า ๆ ใน 📅 ก่อนนะ', 6000); }
}
function distM(a, b) {
  const R = 6371000, dLat = (b[1] - a[1]) * Math.PI / 180, dLng = (b[0] - a[0]) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * Math.PI / 180) * Math.cos(b[1] * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function dayDistance(day) {
  const pts = tracks[day] || [];
  let m = 0;
  for (let i = 1; i < pts.length; i++) m += distM(pts[i - 1], pts[i]);
  return m;
}
function trackGeoJSON(day) {
  return { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: (tracks[day] || []).map(p => [p[0], p[1]]) } };
}
function initTrackLayer() {
  if (map.getSource('travel-track')) return;
  map.addSource('travel-track', { type: 'geojson', data: trackGeoJSON(todayKey()) });
  map.addLayer({
    id: 'travel-track', type: 'line', source: 'travel-track',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffb340', 'line-width': 5, 'line-opacity': 0.92 }
  });
}
function updateTrackLine(day) {
  const s = map.getSource('travel-track');
  if (s) s.setData(trackGeoJSON(day));
}
function recordFix(lng, lat, accuracy) {
  if (accuracy > 60) return; // สัญญาณแกว่งเกินไป ข้าม
  const k = todayKey();
  const arr = tracks[k] = tracks[k] || [];
  const p = [+lng.toFixed(6), +lat.toFixed(6), Date.now()];
  if (arr.length && distM(arr[arr.length - 1], p) < 6) return; // ยังไม่ขยับจริง
  arr.push(p);
  saveTracks();
  queuePush(k); // ส่งขึ้นคลาวด์ (ถ้าล็อกอินอยู่)
  if (!viewDay || viewDay === k) updateTrackLine(k);
}

function startWatch() {
  if (watchId !== null) return;
  if (IS_NATIVE_APP) { startNativeWatch(); return; }
  watchId = navigator.geolocation.watchPosition(onFix, onGeoError,
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}

function onFix(pos) {
  const { longitude, latitude, heading, speed, accuracy } = pos.coords;

  if (!meMarker) {
    const dot = document.createElement('div');
    dot.className = 'me-dot';
    meMarker = new maplibregl.Marker({ element: dot }).setLngLat([longitude, latitude]).addTo(map);
  } else {
    meMarker.setLngLat([longitude, latitude]);
  }

  if (recording) recordFix(longitude, latitude, accuracy);

  if (!following) return;
  if (firstFix) {
    firstFix = false;
    toast('เจอแล้ว! กำลังบินไปหาคุณ 📍');
    map.flyTo({ center: [longitude, latitude], zoom: 17, pitch: buildingsOn ? 60 : 0, duration: 3500, essential: true });
  } else {
    const cam = { center: [longitude, latitude], duration: 900 };
    // หันแผนที่ตามทิศที่เคลื่อนที่ (GPS บอกทิศได้เฉพาะตอนกำลังขยับ)
    if (heading !== null && !Number.isNaN(heading) && speed > 0.8) cam.bearing = heading;
    map.easeTo(cam);
  }
}

function onGeoError(err) {
  stopFollow();
  setRecording(false);
  stopWatch();
  toast(err && err.code === 1
    ? 'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง — เปิดสิทธิ์ Location ให้เบราว์เซอร์ในตั้งค่าเครื่องก่อนนะ'
    : 'หาตำแหน่งไม่เจอ ลองใหม่อีกครั้ง 🛰️', 6000);
}

// ===== โหมดแอปจริง (Capacitor) — GPS ทำงานต่อแม้พับจอ =====
const IS_NATIVE_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function startNativeWatch() {
  const BG = window.Capacitor.Plugins.BackgroundGeolocation;
  BG.addWatcher({
    backgroundTitle: 'Lala Map กำลังบันทึกเส้นทาง',
    backgroundMessage: 'แตะเพื่อกลับเข้าแอป',
    requestPermissions: true,
    stale: false,
    distanceFilter: 5
  }, (loc, error) => {
    if (error) {
      if (error.code === 'NOT_AUTHORIZED' &&
          confirm('แอปต้องใช้สิทธิ์ตำแหน่ง — เปิดหน้าตั้งค่าเลยไหม?')) {
        BG.openSettings();
      }
      onGeoError({ code: error.code === 'NOT_AUTHORIZED' ? 1 : 2 });
      return;
    }
    onFix({ coords: {
      longitude: loc.longitude, latitude: loc.latitude,
      heading: loc.bearing, speed: loc.speed, accuracy: loc.accuracy
    } });
  }).then(id => { watchId = id; });
}

function toggleFollow() {
  if (following) { stopFollow(); toast('หยุดตาม GPS แล้ว'); return; }
  if (!IS_NATIVE_APP && !('geolocation' in navigator)) { toast('เครื่องนี้ไม่รองรับ GPS 😢'); return; }
  following = true;
  btnFollow.classList.add('on');
  stopSpin();
  setActiveChip(-1);
  if (watchId === null) { firstFix = true; toast('กำลังหาตำแหน่ง... 🛰️', 10000); }
  startWatch();
}

function stopFollow() {
  following = false;
  btnFollow.classList.remove('on');
}

function stopWatch() {
  if (watchId === null) return;
  if (IS_NATIVE_APP) {
    window.Capacitor.Plugins.BackgroundGeolocation.removeWatcher({ id: watchId }).catch(() => {});
  } else {
    navigator.geolocation.clearWatch(watchId);
  }
  watchId = null;
}

// ===== ปุ่มอัดเส้นทาง =====
// Wake Lock — กันหน้าจอดับระหว่างอัด (เว็บเก็บ GPS ไม่ได้ตอนจอดับ)
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { console.warn('[wakelock]', e); }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

function setRecording(on) {
  recording = on;
  localStorage.setItem('lala-rec', on ? '1' : '0');
  btnRec.classList.toggle('rec', on);
  if (on) acquireWakeLock(); else releaseWakeLock();
}
function toggleRec() {
  if (recording) {
    setRecording(false);
    toast('หยุดบันทึกแล้ว ⏹ วันนี้ได้ ' + (dayDistance(todayKey()) / 1000).toFixed(2) + ' กม.', 5000);
    return;
  }
  if (!IS_NATIVE_APP && !('geolocation' in navigator)) { toast('เครื่องนี้ไม่รองรับ GPS 😢'); return; }
  setRecording(true);
  startWatch();
  toast(IS_NATIVE_APP
    ? 'เริ่มบันทึก ⏺ — โหมดแอป บันทึกต่อได้แม้พับจอ/ล็อกจอ 🎉'
    : ('wakeLock' in navigator
      ? 'เริ่มบันทึก ⏺ กันจอดับให้แล้ว — เปิดหน้านี้ค้างไว้ระหว่างเดินทางนะ'
      : 'เริ่มบันทึกการเดินทาง ⏺ — ต้องเปิดหน้านี้ค้างไว้และอย่าให้จอดับนะ'), 6000);
}

// ===== แผงประวัติรายวัน =====
function thaiDate(day) {
  const isToday = day === todayKey();
  const t = new Date(day + 'T12:00:00').toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  return t + (isToday ? ' · วันนี้' : '');
}
function renderHist() {
  const list = document.getElementById('histList');
  const days = Object.keys(tracks).filter(d => (tracks[d] || []).length).sort().reverse();
  if (!days.length) {
    list.innerHTML = '<p class="hist-empty">ยังไม่มีเส้นทางที่บันทึกไว้<br>กดปุ่ม ⏺ เพื่อเริ่มเก็บการเดินทางของวันนี้</p>';
    return;
  }
  list.innerHTML = days.map(d =>
    `<div class="hist-row">
      <div class="hist-info" onclick="viewTrack('${d}')">
        <b>${thaiDate(d)}</b>
        <span>${(dayDistance(d) / 1000).toFixed(2)} กม. · ${tracks[d].length} จุด</span>
      </div>
      <button class="hist-del" onclick="delTrack('${d}')">🗑</button>
    </div>`).join('');
}
function toggleHist() {
  const p = document.getElementById('histPanel');
  if (p.classList.toggle('open')) renderHist();
}
function viewTrack(day) {
  viewDay = day === todayKey() ? null : day;
  updateTrackLine(day);
  const pts = tracks[day] || [];
  stopSpin();
  stopFollow();
  if (pts.length > 1) {
    const lngs = pts.map(p => p[0]), lats = pts.map(p => p[1]);
    map.fitBounds(
      [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
      { padding: 70, pitch: 0, bearing: 0, duration: 2200, maxZoom: 16.5 }
    );
  } else if (pts.length === 1) {
    map.flyTo({ center: [pts[0][0], pts[0][1]], zoom: 16, duration: 2200 });
  }
  toggleHist();
  toast(thaiDate(day) + ' · ' + (dayDistance(day) / 1000).toFixed(2) + ' กม.', 5000);
}
function delTrack(day) {
  if (!confirm('ลบเส้นทางของ ' + thaiDate(day) + ' ทิ้งถาวร?')) return;
  delete tracks[day];
  saveTracks();
  if (cloudActive()) trackRef(day).delete().catch(e => console.warn('[cloud-del]', e));
  renderHist();
  if (viewDay === day) viewDay = null;
  updateTrackLine(viewDay || todayKey());
}

function cloudActive() { return !!(db && (fbUser || syncCode)); }
function trackRef(day) {
  return fbUser
    ? db.collection('users').doc(fbUser.uid).collection('tracks').doc(day)
    : db.collection('syncs').doc(syncCode).collection('tracks').doc(day);
}
function tracksCol() {
  return fbUser
    ? db.collection('users').doc(fbUser.uid).collection('tracks')
    : db.collection('syncs').doc(syncCode).collection('tracks');
}

// รวมจุดสองชุดโดยใช้เวลาเป็นตัวกันซ้ำ
function mergePoints(a, b) {
  const m = new Map();
  [...a, ...b].forEach(p => m.set(p[2], p));
  return [...m.values()].sort((x, y) => x[2] - y[2]);
}

function queuePush(day) {
  if (!cloudActive()) return;
  dirtyDays.add(day);
  if (!pushTimer) pushTimer = setTimeout(flushPush, 12000); // ส่งเป็นชุดทุก ~12 วิ ประหยัดโควต้า
}

async function flushPush() {
  pushTimer = null;
  if (!cloudActive()) { dirtyDays.clear(); return; }
  const days = [...dirtyDays];
  dirtyDays.clear();
  for (const d of days) {
    try {
      // Firestore ห้าม array ซ้อน array — เก็บเป็น JSON string แทน
      await trackRef(d).set({ points: JSON.stringify(tracks[d] || []), updatedAt: Date.now() });
    } catch (e) {
      console.warn('[cloud-push]', e);
      toast('ซิงก์ขึ้นคลาวด์ไม่สำเร็จ — เช็ค Firestore rules ใน Firebase console', 6000);
    }
  }
}

function startCloudSync() {
  stopCloudSync();
  if (!cloudActive()) return;
  // ดันข้อมูลในเครื่องทั้งหมดขึ้นไปก่อน
  Object.keys(tracks).forEach(d => dirtyDays.add(d));
  if (dirtyDays.size && !pushTimer) pushTimer = setTimeout(flushPush, 3000);
  // ฟังการเปลี่ยนแปลงจากคลาวด์เรียลไทม์ (เครื่องอื่นอัดอยู่ก็เห็นที่นี่ทันที)
  unsubCloud = tracksCol().onSnapshot(snap => {
    let changed = false;
    snap.forEach(doc => {
      let pts = [];
      try { pts = JSON.parse(doc.data().points || '[]'); } catch (e) {}
      const d = doc.id;
      const merged = mergePoints(tracks[d] || [], pts);
      if (merged.length !== (tracks[d] || []).length) { tracks[d] = merged; changed = true; }
      if (merged.length !== pts.length) queuePush(d); // เครื่องเรามีจุดที่คลาวด์ยังไม่มี
    });
    if (changed) {
      saveTracks();
      updateTrackLine(viewDay || todayKey());
      if (document.getElementById('histPanel').classList.contains('open')) renderHist();
    }
  }, e => console.warn('[cloud-sync]', e));
}

function stopCloudSync() {
  if (unsubCloud) { unsubCloud(); unsubCloud = null; }
}

// สลับแอป/พับจอ — รีบส่งของที่ค้างขึ้นคลาวด์ก่อน แล้วขอกันจอดับคืนตอนกลับมา
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && pushTimer) {
    clearTimeout(pushTimer);
    flushPush();
  }
  // Wake lock หลุดเองทุกครั้งที่สลับแอป — ขอใหม่ถ้ายังอัดอยู่
  if (document.visibilityState === 'visible' && recording) acquireWakeLock();
});

// ผู้ใช้ลากแผนที่เอง = เลิกล็อกกล้อง (จุดตำแหน่งยังอยู่ กดเข็มทิศเพื่อล็อกใหม่)
map.on('dragstart', () => { if (following) { stopFollow(); toast('เลิกล็อกกล้อง — กด 🧭 เพื่อกลับมาตาม GPS'); } });

// ===== บินไปเมืองต่าง ๆ =====
const chipsEl = document.getElementById('chips');
CITIES.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = c.name;
  b.onclick = () => {
    stopSpin();
    stopFollow();
    setActiveChip(i);
    if (c.sat && !satOn) toggleSat(); // จุดชมภูเขาต้องใช้ภาพดาวเทียม + ภูมิประเทศ 3D
    map.flyTo({
      center: c.center, zoom: c.zoom, bearing: c.bearing,
      pitch: c.pitch !== undefined ? c.pitch : (buildingsOn ? 62 : 0),
      duration: 4500, essential: true
    });
  };
  chipsEl.appendChild(b);
});

function setActiveChip(idx) {
  [...chipsEl.children].forEach((el, i) => el.classList.toggle('active', i === idx));
}

// ===== ลูกโลกหมุนเอง จนกว่าผู้ใช้จะแตะแผนที่ =====
let spinning = true;
function spinGlobe() {
  if (!spinning || map.getZoom() > 4) return;
  const c = map.getCenter();
  c.lng += 12; // องศาต่อรอบ ease (~ค่อย ๆ หมุน)
  map.easeTo({ center: c, duration: 6000, easing: t => t });
}
function stopSpin() { spinning = false; }
map.on('moveend', spinGlobe);
['mousedown', 'touchstart', 'wheel', 'dblclick'].forEach(e => map.on(e, stopSpin));

// โชว์ลูกโลกทันทีที่วาดเฟรมแรก — ไม่ต้องรอ tiles โหลดครบ
map.once('render', hideLoading);

map.on('load', () => {
  hideLoading();
  spinGlobe();
  initTrackLayer();
  // เปิดแอปมาใหม่: วาดเส้นทางวันนี้ + อัดต่ออัตโนมัติถ้าเปิดบันทึกค้างไว้
  updateTrackLine(todayKey());
  if (recording) { btnRec.classList.add('rec'); startWatch(); acquireWakeLock(); }
  setTimeout(() => document.getElementById('hint').classList.add('hide'), 6000);
});

// กันค้าง: ถ้าผ่านไป 15 วิแล้วยังไม่ขึ้นแผนที่ ให้แจ้งผู้ใช้
setTimeout(() => {
  if (!loadingEl.classList.contains('hide')) {
    loadingMsg.innerHTML = 'โหลดช้าผิดปกติ — เน็ตอาจอ่อน 📶<br>ลองรีเฟรชหน้านี้อีกครั้ง';
  }
}, 15000);

// Service worker (PWA เดิมของแอป)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
