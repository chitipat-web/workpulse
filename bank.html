<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0ea5e9">
<title>บันทึกยอดเงินโอนเข้า</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #273449;
    --line: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --green: #22c55e;
    --green-d: #16a34a;
    --blue: #0ea5e9;
    --red: #ef4444;
    --accent: #38bdf8;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sukhumvit Set", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 90px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }

  header {
    text-align: center;
    padding: 22px 16px 16px;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* Summary card */
  .summary {
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    border-radius: 20px;
    padding: 22px 20px;
    box-shadow: 0 10px 30px rgba(14,165,233,.25);
    margin-bottom: 16px;
  }
  .summary .label { font-size: 13px; opacity: .85; }
  .summary .total {
    font-size: 38px; font-weight: 800; letter-spacing: -1px; margin-top: 4px;
    word-break: break-all;
  }
  .summary .total small { font-size: 18px; font-weight: 600; opacity: .85; }
  .summary .meta {
    display: flex; gap: 14px; margin-top: 14px; font-size: 13px;
    border-top: 1px solid rgba(255,255,255,.25); padding-top: 12px;
  }
  .summary .meta div span { display: block; opacity: .8; font-size: 11px; }
  .summary .meta div b { font-size: 15px; font-weight: 700; }

  /* mini stats */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
  }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat b { display: block; font-size: 18px; font-weight: 700; margin-top: 2px; }

  /* Filter bar */
  .bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .bar select, .bar input {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 11px 12px; font-size: 14px;
    appearance: none; outline: none;
  }

  /* list */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 13px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .item .ava {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    background: rgba(34,197,94,.15); color: var(--green);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .item .info { flex: 1; min-width: 0; }
  .item .info .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .info .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .item .info .note { color: var(--muted); font-size: 12px; margin-top: 2px; font-style: italic; }
  .item .amt { text-align: right; flex-shrink: 0; }
  .item .amt b { color: var(--green); font-size: 16px; font-weight: 700; }
  .item .amt .del {
    display: block; margin-top: 6px; color: var(--muted); font-size: 11px;
    cursor: pointer; background: none; border: none;
  }
  .item .amt .del:active { color: var(--red); }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .empty .ic { font-size: 50px; }
  .empty p { margin-top: 10px; font-size: 14px; }

  .group-date {
    color: var(--muted); font-size: 12px; font-weight: 600;
    margin: 10px 2px 2px; display: flex; justify-content: space-between;
  }

  /* FAB */
  .fab {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 528px;
    background: linear-gradient(135deg, var(--green), var(--green-d));
    color: #fff; border: none; border-radius: 16px;
    padding: 16px; font-size: 16px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(34,197,94,.35); cursor: pointer;
  }
  .fab:active { transform: translateX(-50%) scale(.98); }

  /* Modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal.show { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 560px;
    border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    animation: up .25s ease;
  }
  @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet h2 { font-size: 18px; margin-bottom: 16px; text-align: center; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--card2); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 13px 14px; font-size: 16px;
    outline: none; appearance: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field .amount-in { font-size: 24px; font-weight: 700; text-align: center; color: var(--green); }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  .btns { display: flex; gap: 10px; margin-top: 8px; }
  .btns button { flex: 1; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn-save { background: var(--green); color: #fff; }
  .btn-cancel { background: var(--card2); color: var(--text); }

  .tools { display: flex; gap: 8px; justify-content: center; margin: 18px 0 4px; }
  .tools button {
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💰 ยอดเงินโอนเข้า</h1>
    <p>บันทึกเงินที่โอนเข้าบัญชีธนาคาร</p>
  </header>

  <div class="summary">
    <div class="label" id="sumLabel">ยอดรวมทั้งหมด</div>
    <div class="total"><span id="totalAmt">0</span> <small>บาท</small></div>
    <div class="meta">
      <div><span>จำนวนรายการ</span><b id="count">0</b></div>
      <div><span>เฉลี่ยต่อรายการ</span><b id="avg">0</b></div>
      <div><span>รายการล่าสุด</span><b id="last">-</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span>เดือนนี้</span><b id="thisMonth">0 ฿</b></div>
    <div class="stat"><span>วันนี้</span><b id="today">0 ฿</b></div>
  </div>

  <div class="bar">
    <select id="filterMonth"><option value="all">ทุกเดือน</option></select>
    <input id="search" type="search" placeholder="🔍 ค้นหา ชื่อ/ธนาคาร/โน้ต">
  </div>

  <div class="list" id="list"></div>

  <div class="tools">
    <button onclick="exportCSV()">⬇️ ส่งออก CSV</button>
    <button onclick="clearAll()">🗑️ ล้างทั้งหมด</button>
  </div>
</div>

<button class="fab" onclick="openModal()">+ เพิ่มยอดโอนเข้า</button>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="modalTitle">เพิ่มยอดโอนเข้า</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>จำนวนเงิน (บาท)</label>
      <input id="fAmount" class="amount-in" type="number" inputmode="decimal" placeholder="0.00" step="0.01">
    </div>
    <div class="field">
      <label>ผู้โอน / ชื่อรายการ</label>
      <input id="fName" type="text" placeholder="เช่น คุณสมชาย, ค่าสินค้า">
    </div>
    <div class="row2">
      <div class="field">
        <label>ธนาคาร</label>
        <select id="fBank">
          <option value="">— เลือก —</option>
          <option>กสิกรไทย</option>
          <option>ไทยพาณิชย์</option>
          <option>กรุงเทพ</option>
          <option>กรุงไทย</option>
          <option>กรุงศรีอยุธยา</option>
          <option>ทหารไทยธนชาต</option>
          <option>ออมสิน</option>
          <option>พร้อมเพย์</option>
          <option>TrueMoney</option>
          <option>อื่นๆ</option>
        </select>
      </div>
      <div class="field">
        <label>วันที่</label>
        <input id="fDate" type="date">
      </div>
    </div>
    <div class="field">
      <label>โน้ต (ถ้ามี)</label>
      <input id="fNote" type="text" placeholder="รายละเอียดเพิ่มเติม">
    </div>
    <div class="btns">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-save" onclick="save()">บันทึก</button>
    </div>
  </div>
</div>

<script>
const KEY = 'bank_transfers_v1';
let data = [];

function load() {
  try { data = JSON.parse(localStorage.getItem(KEY)) || []; }
  catch (e) { data = []; }
}
function persist() { localStorage.setItem(KEY, JSON.stringify(data)); }

function fmt(n) {
  return Number(n).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function fmtShort(n) {
  n = Number(n);
  if (n >= 1e6) return (n/1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + 'M ฿';
  if (n >= 1e3) return (n/1e3).toFixed(n % 1e3 === 0 ? 0 : 1) + 'K ฿';
  return fmt(n) + ' ฿';
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function thaiDate(s) {
  const [y,m,d] = s.split('-');
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return Number(d) + ' ' + months[Number(m)-1] + ' ' + (Number(y)+543).toString().slice(-2);
}
function monthLabel(ym) {
  const [y,m] = ym.split('-');
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  return months[Number(m)-1] + ' ' + (Number(y)+543);
}

// Modal
function openModal(id) {
  document.getElementById('modal').classList.add('show');
  if (id) {
    const it = data.find(x => x.id === id);
    document.getElementById('modalTitle').textContent = 'แก้ไขรายการ';
    document.getElementById('editId').value = it.id;
    document.getElementById('fAmount').value = it.amount;
    document.getElementById('fName').value = it.name;
    document.getElementById('fBank').value = it.bank;
    document.getElementById('fDate').value = it.date;
    document.getElementById('fNote').value = it.note;
  } else {
    document.getElementById('modalTitle').textContent = 'เพิ่มยอดโอนเข้า';
    document.getElementById('editId').value = '';
    document.getElementById('fAmount').value = '';
    document.getElementById('fName').value = '';
    document.getElementById('fBank').value = '';
    document.getElementById('fDate').value = todayStr();
    document.getElementById('fNote').value = '';
    setTimeout(() => document.getElementById('fAmount').focus(), 200);
  }
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

function save() {
  const amount = parseFloat(document.getElementById('fAmount').value);
  if (!amount || amount <= 0) { alert('กรุณาใส่จำนวนเงินให้ถูกต้อง'); return; }
  const rec = {
    id: document.getElementById('editId').value || ('t' + Date.now()),
    amount: amount,
    name: document.getElementById('fName').value.trim() || 'ไม่ระบุชื่อ',
    bank: document.getElementById('fBank').value,
    date: document.getElementById('fDate').value || todayStr(),
    note: document.getElementById('fNote').value.trim()
  };
  const idx = data.findIndex(x => x.id === rec.id);
  if (idx >= 0) data[idx] = rec; else data.push(rec);
  persist();
  closeModal();
  render();
}

function del(id) {
  if (!confirm('ลบรายการนี้?')) return;
  data = data.filter(x => x.id !== id);
  persist();
  render();
}

function clearAll() {
  if (!data.length) return;
  if (!confirm('ล้างข้อมูลทั้งหมด? ไม่สามารถกู้คืนได้')) return;
  data = [];
  persist();
  render();
}

function exportCSV() {
  if (!data.length) { alert('ยังไม่มีข้อมูล'); return; }
  let csv = '﻿วันที่,ผู้โอน,ธนาคาร,จำนวนเงิน,โน้ต\n';
  [...data].sort((a,b) => a.date.localeCompare(b.date)).forEach(it => {
    csv += `${it.date},"${it.name}","${it.bank}",${it.amount},"${it.note}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ยอดโอนเข้า_' + todayStr() + '.csv';
  a.click();
}

function render() {
  // build month options
  const months = [...new Set(data.map(x => x.date.slice(0,7)))].sort().reverse();
  const fm = document.getElementById('filterMonth');
  const cur = fm.value;
  fm.innerHTML = '<option value="all">ทุกเดือน</option>' +
    months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
  if ([...fm.options].some(o => o.value === cur)) fm.value = cur;

  const monthSel = fm.value;
  const q = document.getElementById('search').value.trim().toLowerCase();

  let rows = data.filter(it => {
    if (monthSel !== 'all' && it.date.slice(0,7) !== monthSel) return false;
    if (q && !((it.name + ' ' + it.bank + ' ' + it.note).toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  // summary (based on current filter)
  const total = rows.reduce((s,x) => s + x.amount, 0);
  document.getElementById('totalAmt').textContent = fmt(total);
  document.getElementById('count').textContent = rows.length;
  document.getElementById('avg').textContent = rows.length ? fmt(Math.round(total/rows.length)) : '0';
  document.getElementById('last').textContent = rows.length ? thaiDate(rows[0].date) : '-';
  document.getElementById('sumLabel').textContent =
    monthSel === 'all' ? 'ยอดรวมทั้งหมด' : 'ยอดรวม ' + monthLabel(monthSel);

  // this month / today (always full data)
  const tm = todayStr().slice(0,7), td = todayStr();
  document.getElementById('thisMonth').textContent =
    fmtShort(data.filter(x => x.date.slice(0,7) === tm).reduce((s,x) => s + x.amount, 0));
  document.getElementById('today').textContent =
    fmtShort(data.filter(x => x.date === td).reduce((s,x) => s + x.amount, 0));

  // list grouped by date
  const list = document.getElementById('list');
  if (!rows.length) {
    list.innerHTML = '<div class="empty"><div class="ic">📭</div><p>ยังไม่มีรายการ<br>กดปุ่มด้านล่างเพื่อเพิ่มยอดโอนเข้า</p></div>';
    return;
  }
  let html = '', lastDate = '';
  rows.forEach(it => {
    if (it.date !== lastDate) {
      lastDate = it.date;
      const dayTotal = rows.filter(x => x.date === it.date).reduce((s,x) => s + x.amount, 0);
      html += `<div class="group-date"><span>${thaiDate(it.date)}</span><span>${fmt(dayTotal)} ฿</span></div>`;
    }
    const esc = s => (s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    html += `
      <div class="item" onclick="openModal('${it.id}')">
        <div class="ava">↓</div>
        <div class="info">
          <div class="name">${esc(it.name)}</div>
          <div class="sub">${esc(it.bank) || 'ไม่ระบุธนาคาร'}</div>
          ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
        </div>
        <div class="amt">
          <b>+${fmt(it.amount)}</b>
          <button class="del" onclick="event.stopPropagation(); del('${it.id}')">ลบ</button>
        </div>
      </div>`;
  });
  list.innerHTML = html;
}

document.getElementById('filterMonth').addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);

load();
render();
</script>
</body>
</html>
