<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Quest">
<link rel="apple-touch-icon" href="game-icon-180.png">
<link rel="icon" type="image/png" href="game-icon-192.png">
<link rel="manifest" href="game-manifest.json">
<title>Pixel Quest - เกมผจญภัย</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0f172a; font-family: system-ui, -apple-system, sans-serif; color:#fff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background: linear-gradient(180deg,#87ceeb 0%, #b3e0f5 60%, #d4f0ff 100%); image-rendering: pixelated; image-rendering: crisp-edges; max-width:100%; max-height:100%; touch-action:none; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #hud { position:fixed; top:12px; left:0; right:0; display:flex; justify-content:space-between; padding:0 16px; pointer-events:none; font-weight:700; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; font-size:18px; z-index:5; }
  #hud .pill { background:rgba(0,0,0,.35); border-radius:12px; padding:6px 12px; backdrop-filter: blur(4px); }
  #overlay { position:fixed; inset:0; background:rgba(15,23,42,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:10; padding:20px; text-align:center; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:clamp(28px, 7vw, 56px); background: linear-gradient(90deg,#fde047,#f97316,#ef4444); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:1px; }
  #overlay p { font-size:clamp(14px, 3.5vw, 18px); color:#cbd5e1; max-width:480px; line-height:1.6; }
  #overlay button { background:linear-gradient(180deg,#fbbf24,#f59e0b); color:#1e293b; font-weight:800; padding:14px 32px; border:none; border-radius:14px; font-size:18px; cursor:pointer; box-shadow: 0 6px 0 #b45309, 0 10px 30px rgba(245,158,11,.4); transition: transform .1s; }
  #overlay button:active { transform: translateY(3px); box-shadow: 0 3px 0 #b45309; }
  .keys { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; color:#94a3b8; font-size:13px; }
  .keys kbd { background:#334155; color:#fff; padding:4px 10px; border-radius:6px; border-bottom:2px solid #1e293b; font-family: monospace; }
  /* Touch controls */
  #touch { position:fixed; bottom:0; left:0; right:0; padding:18px; display:none; justify-content:space-between; pointer-events:none; z-index:6; }
  #touch.show { display:flex; }
  #touch .group { display:flex; gap:12px; pointer-events:auto; }
  #touch button { width:64px; height:64px; border-radius:50%; border:none; background:rgba(255,255,255,.25); backdrop-filter: blur(8px); color:#fff; font-size:28px; font-weight:800; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  #touch button:active { background:rgba(255,255,255,.45); transform: scale(.95); }
  #touch .jump { width:80px; height:80px; background:rgba(251,191,36,.5); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>

<div id="hud">
  <div class="pill">❤️ <span id="lives">3</span></div>
  <div class="pill">🪙 <span id="coins">0</span></div>
  <div class="pill">⭐ <span id="score">0</span></div>
  <div class="pill">🏁 <span id="level">1</span>/3</div>
</div>

<div id="touch">
  <div class="group">
    <button id="btnLeft">◀</button>
    <button id="btnRight">▶</button>
  </div>
  <div class="group">
    <button id="btnJump" class="jump">▲</button>
  </div>
</div>

<div id="overlay">
  <h1 id="title">PIXEL QUEST</h1>
  <p id="message">ผจญภัยไปกับฮีโร่ตัวจิ๋ว — เก็บเหรียญ หลบศัตรู และไปให้ถึงธง 🚩</p>
  <div class="keys">
    <span><kbd>←</kbd> <kbd>→</kbd> เดิน</span>
    <span><kbd>Space</kbd> หรือ <kbd>↑</kbd> กระโดด</span>
    <span><kbd>R</kbd> เริ่มใหม่</span>
  </div>
  <button id="startBtn">เริ่มเล่น</button>
</div>

<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;
  const GROUND_Y = H - 60;
  const GRAVITY = 0.7;
  const JUMP_V = -14.5;
  const MOVE_SPEED = 4.2;

  // UI
  const $lives = document.getElementById('lives');
  const $coins = document.getElementById('coins');
  const $score = document.getElementById('score');
  const $level = document.getElementById('level');
  const $overlay = document.getElementById('overlay');
  const $title = document.getElementById('title');
  const $message = document.getElementById('message');
  const $startBtn = document.getElementById('startBtn');
  const $touch = document.getElementById('touch');

  // Detect touch
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) $touch.classList.add('show');

  // Input
  const keys = { left:false, right:false, jump:false };
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { keys.jump = true; e.preventDefault(); }
    if (e.code === 'KeyR') resetGame();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
  });
  const bind = (id, k) => {
    const el = document.getElementById(id);
    const on = e => { e.preventDefault(); keys[k] = true; };
    const off = e => { e.preventDefault(); keys[k] = false; };
    el.addEventListener('touchstart', on, {passive:false});
    el.addEventListener('touchend', off); el.addEventListener('touchcancel', off);
    el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
  };
  bind('btnLeft','left'); bind('btnRight','right'); bind('btnJump','jump');

  // Levels
  const LEVELS = [
    {
      width: 2400, bg: 'day',
      platforms: [
        {x:300, y:GROUND_Y-90, w:120, h:20},
        {x:520, y:GROUND_Y-160, w:120, h:20},
        {x:740, y:GROUND_Y-90, w:120, h:20},
        {x:1000, y:GROUND_Y-140, w:160, h:20},
        {x:1300, y:GROUND_Y-90, w:120, h:20},
        {x:1500, y:GROUND_Y-180, w:120, h:20},
        {x:1750, y:GROUND_Y-90, w:140, h:20},
        {x:2050, y:GROUND_Y-140, w:120, h:20},
      ],
      gaps: [{x:880, w:80}, {x:1900, w:90}],
      coins: [340,560,780,1040,1080,1340,1540,1790,2090,2130],
      enemies: [{x:600, range:120}, {x:1100, range:100}, {x:1400, range:80}, {x:1800, range:130}],
      goal: 2300
    },
    {
      width: 2800, bg: 'sunset',
      platforms: [
        {x:200, y:GROUND_Y-120, w:100, h:20},
        {x:380, y:GROUND_Y-180, w:100, h:20},
        {x:560, y:GROUND_Y-100, w:80, h:20},
        {x:720, y:GROUND_Y-200, w:120, h:20},
        {x:950, y:GROUND_Y-120, w:80, h:20},
        {x:1120, y:GROUND_Y-180, w:80, h:20},
        {x:1280, y:GROUND_Y-240, w:120, h:20},
        {x:1500, y:GROUND_Y-160, w:80, h:20},
        {x:1680, y:GROUND_Y-90, w:120, h:20},
        {x:1900, y:GROUND_Y-200, w:100, h:20},
        {x:2120, y:GROUND_Y-140, w:120, h:20},
        {x:2350, y:GROUND_Y-100, w:140, h:20},
      ],
      gaps: [{x:640, w:70}, {x:1400, w:90}, {x:2050, w:60}],
      coins: [230,410,590,750,990,1160,1320,1540,1720,1940,2160,2390,2430],
      enemies: [{x:400, range:150}, {x:850, range:100}, {x:1250, range:140}, {x:1600, range:120}, {x:2000, range:130}, {x:2400, range:100}],
      goal: 2700
    },
    {
      width: 3400, bg: 'night',
      platforms: [
        {x:200, y:GROUND_Y-100, w:80, h:20},
        {x:340, y:GROUND_Y-170, w:80, h:20},
        {x:480, y:GROUND_Y-240, w:80, h:20},
        {x:640, y:GROUND_Y-180, w:80, h:20},
        {x:800, y:GROUND_Y-120, w:80, h:20},
        {x:980, y:GROUND_Y-200, w:100, h:20},
        {x:1180, y:GROUND_Y-260, w:100, h:20},
        {x:1380, y:GROUND_Y-200, w:80, h:20},
        {x:1540, y:GROUND_Y-130, w:80, h:20},
        {x:1700, y:GROUND_Y-200, w:80, h:20},
        {x:1850, y:GROUND_Y-280, w:80, h:20},
        {x:2020, y:GROUND_Y-200, w:80, h:20},
        {x:2200, y:GROUND_Y-130, w:100, h:20},
        {x:2400, y:GROUND_Y-220, w:100, h:20},
        {x:2600, y:GROUND_Y-160, w:80, h:20},
        {x:2780, y:GROUND_Y-240, w:100, h:20},
        {x:3000, y:GROUND_Y-130, w:120, h:20},
      ],
      gaps: [{x:440, w:80}, {x:920, w:90}, {x:1480, w:80}, {x:2120, w:90}, {x:2700, w:70}],
      coins: [220,360,500,660,820,1000,1200,1400,1560,1720,1870,2040,2220,2420,2620,2800,3030],
      enemies: [{x:300, range:160}, {x:700, range:120}, {x:1050, range:180}, {x:1450, range:150}, {x:1800, range:170}, {x:2150, range:140}, {x:2500, range:160}, {x:2900, range:180}, {x:3150, range:140}],
      goal: 3300
    }
  ];

  // Game state
  let state = {
    levelIdx: 0, lives: 3, totalScore: 0, totalCoins: 0,
    player: null, enemies: [], coins: [], particles: [],
    cameraX: 0, levelData: null, status: 'menu', flagAnim: 0,
    invulnerable: 0
  };

  function loadLevel(idx) {
    const L = LEVELS[idx];
    state.levelData = L;
    state.cameraX = 0;
    state.player = { x: 60, y: GROUND_Y - 40, w: 28, h: 40, vx:0, vy:0, onGround:false, facing:1, anim:0 };
    state.enemies = L.enemies.map(e => ({
      x: e.x, y: GROUND_Y - 28, w: 32, h: 28,
      startX: e.x, range: e.range, dir: 1, alive: true, deadTimer: 0, anim:0
    }));
    state.coins = L.coins.map(cx => ({
      x: cx, y: GROUND_Y - 90 - Math.sin(cx*0.01)*20, collected: false, anim: Math.random()*Math.PI*2
    }));
    // Add coins above some platforms
    L.platforms.forEach(p => {
      if (Math.random() < 0.5) state.coins.push({ x: p.x + p.w/2 - 8, y: p.y - 40, collected:false, anim:Math.random()*Math.PI*2 });
    });
    state.particles = [];
    state.flagAnim = 0;
    state.invulnerable = 60;
  }

  function startGame() {
    state.levelIdx = 0;
    state.lives = 3;
    state.totalScore = 0;
    state.totalCoins = 0;
    loadLevel(0);
    state.status = 'playing';
    $overlay.classList.add('hidden');
    updateHUD();
  }

  function resetGame() { showMenu(); }

  function showMenu(title='PIXEL QUEST', msg='ผจญภัยไปกับฮีโร่ตัวจิ๋ว — เก็บเหรียญ หลบศัตรู และไปให้ถึงธง 🚩', btn='เริ่มเล่น') {
    state.status = 'menu';
    $title.textContent = title;
    $message.innerHTML = msg;
    $startBtn.textContent = btn;
    $overlay.classList.remove('hidden');
  }

  function updateHUD() {
    $lives.textContent = state.lives;
    $coins.textContent = state.totalCoins;
    $score.textContent = state.totalScore;
    $level.textContent = state.levelIdx + 1;
  }

  function spawnParticles(x, y, color, n=8) {
    for (let i=0; i<n; i++) {
      state.particles.push({
        x, y, vx: (Math.random()-.5)*6, vy: (Math.random()-.5)*6 - 2,
        life: 30, color, size: 2 + Math.random()*3
      });
    }
  }

  // Collision helpers
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function inGap(x) {
    return state.levelData.gaps.some(g => x > g.x && x < g.x + g.w);
  }

  function playerHit() {
    if (state.invulnerable > 0) return;
    state.lives--;
    state.invulnerable = 90;
    spawnParticles(state.player.x + state.player.w/2, state.player.y + state.player.h/2, '#ef4444', 16);
    if (state.lives <= 0) {
      state.status = 'gameover';
      showMenu('GAME OVER', `ได้คะแนนรวม <b>${state.totalScore}</b><br>เก็บเหรียญได้ <b>${state.totalCoins}</b>`, 'เริ่มใหม่');
    } else {
      // Respawn
      state.player.x = 60;
      state.player.y = GROUND_Y - 40;
      state.player.vx = 0; state.player.vy = 0;
    }
    updateHUD();
  }

  function update() {
    if (state.status !== 'playing') return;
    const p = state.player;
    const L = state.levelData;

    // Horizontal input
    p.vx = 0;
    if (keys.left) { p.vx = -MOVE_SPEED; p.facing = -1; }
    if (keys.right) { p.vx = MOVE_SPEED; p.facing = 1; }

    // Jump
    if (keys.jump && p.onGround) {
      p.vy = JUMP_V;
      p.onGround = false;
      spawnParticles(p.x + p.w/2, p.y + p.h, '#fff', 4);
    }

    // Gravity
    p.vy += GRAVITY;
    if (p.vy > 18) p.vy = 18;

    // Horizontal movement & platform collision (X)
    p.x += p.vx;
    if (p.x < 0) p.x = 0;
    if (p.x + p.w > L.width) p.x = L.width - p.w;
    for (const pl of L.platforms) {
      if (aabb(p, pl)) {
        if (p.vx > 0) p.x = pl.x - p.w;
        else if (p.vx < 0) p.x = pl.x + pl.w;
      }
    }

    // Vertical movement
    p.y += p.vy;
    p.onGround = false;

    // Ground collision (with gaps)
    if (p.y + p.h >= GROUND_Y) {
      const feetX = p.x + p.w/2;
      if (!inGap(feetX)) {
        p.y = GROUND_Y - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    }
    // Fall off the map
    if (p.y > H + 100) playerHit();

    // Platform collision (Y)
    for (const pl of L.platforms) {
      if (aabb(p, pl)) {
        if (p.vy > 0) { p.y = pl.y - p.h; p.vy = 0; p.onGround = true; }
        else if (p.vy < 0) { p.y = pl.y + pl.h; p.vy = 0; }
      }
    }

    // Animate player
    if (Math.abs(p.vx) > 0.1 && p.onGround) p.anim += 0.25;

    // Camera follow
    const targetCam = p.x - W/2 + p.w/2;
    state.cameraX += (targetCam - state.cameraX) * 0.1;
    if (state.cameraX < 0) state.cameraX = 0;
    if (state.cameraX > L.width - W) state.cameraX = L.width - W;

    // Enemies
    for (const e of state.enemies) {
      if (!e.alive) { e.deadTimer--; continue; }
      e.x += e.dir * 1.5;
      if (e.x < e.startX - e.range/2) e.dir = 1;
      if (e.x > e.startX + e.range/2) e.dir = -1;
      e.anim += 0.15;

      // Collision with player
      if (aabb(p, e)) {
        // Stomp from above
        if (p.vy > 0 && p.y + p.h - e.y < 18) {
          e.alive = false;
          e.deadTimer = 30;
          p.vy = JUMP_V * 0.7;
          state.totalScore += 100;
          spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ef4444', 12);
          updateHUD();
        } else {
          playerHit();
        }
      }
    }

    // Coins
    for (const c of state.coins) {
      if (c.collected) continue;
      c.anim += 0.1;
      const cb = { x: c.x, y: c.y, w: 16, h: 16 };
      if (aabb(p, cb)) {
        c.collected = true;
        state.totalCoins++;
        state.totalScore += 10;
        spawnParticles(c.x+8, c.y+8, '#fde047', 10);
        updateHUD();
      }
    }

    // Goal
    state.flagAnim += 0.1;
    if (p.x + p.w > L.goal) {
      // Bonus
      state.totalScore += state.lives * 200;
      state.levelIdx++;
      if (state.levelIdx >= LEVELS.length) {
        state.status = 'win';
        showMenu('🏆 ชนะแล้ว!', `ผ่านทุกด่าน!<br>คะแนนรวม: <b>${state.totalScore}</b><br>เหรียญ: <b>${state.totalCoins}</b>`, 'เล่นอีกครั้ง');
      } else {
        loadLevel(state.levelIdx);
        updateHUD();
      }
    }

    // Particles
    for (const pt of state.particles) {
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.3; pt.life--;
    }
    state.particles = state.particles.filter(p => p.life > 0);

    if (state.invulnerable > 0) state.invulnerable--;
  }

  // Drawing
  function drawBackground() {
    const bg = state.levelData.bg;
    let topC, botC, sunC;
    if (bg === 'day') { topC='#87ceeb'; botC='#d4f0ff'; sunC='#fde047'; }
    else if (bg === 'sunset') { topC='#f97316'; botC='#fde047'; sunC='#fff7ed'; }
    else { topC='#1e1b4b'; botC='#312e81'; sunC='#e0e7ff'; }

    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, topC); grad.addColorStop(1, botC);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // Sun/moon
    ctx.fillStyle = sunC;
    ctx.beginPath();
    ctx.arc(W - 100, 90, 40, 0, Math.PI*2);
    ctx.fill();

    // Stars for night
    if (bg === 'night') {
      ctx.fillStyle = '#fff';
      for (let i=0; i<60; i++) {
        const x = (i*97) % W, y = (i*53) % (H/2);
        const tw = Math.sin(Date.now()/500 + i) * 0.5 + 0.5;
        ctx.globalAlpha = tw;
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = 1;
    }

    // Mountains (parallax)
    ctx.fillStyle = bg === 'night' ? '#3b3866' : (bg === 'sunset' ? '#7c2d12' : '#6b8e9f');
    const camP = state.cameraX * 0.3;
    for (let i = -1; i < 8; i++) {
      const mx = i * 400 - (camP % 400);
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 200, GROUND_Y - 180);
      ctx.lineTo(mx + 400, GROUND_Y);
      ctx.fill();
    }
    // Closer hills
    ctx.fillStyle = bg === 'night' ? '#4c1d95' : (bg === 'sunset' ? '#9a3412' : '#4a7c59');
    const camP2 = state.cameraX * 0.5;
    for (let i = -1; i < 10; i++) {
      const mx = i * 300 - (camP2 % 300);
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 150, GROUND_Y - 100);
      ctx.lineTo(mx + 300, GROUND_Y);
      ctx.fill();
    }

    // Clouds
    if (bg !== 'night') {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      const cp = state.cameraX * 0.2;
      for (let i = 0; i < 8; i++) {
        const cx = (i * 350) - (cp % 350);
        const cy = 60 + (i%3)*40;
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI*2);
        ctx.arc(cx+22, cy-8, 26, 0, Math.PI*2);
        ctx.arc(cx+50, cy, 22, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  function drawGround() {
    const L = state.levelData;
    // Grass top + dirt
    ctx.fillStyle = state.levelData.bg === 'night' ? '#1f2937' : '#5b8c3a';
    for (let x = 0; x < L.width; x += 32) {
      if (inGap(x+16)) continue;
      const sx = x - state.cameraX;
      if (sx < -40 || sx > W) continue;
      ctx.fillRect(sx, GROUND_Y, 32, 8);
    }
    ctx.fillStyle = state.levelData.bg === 'night' ? '#374151' : '#8b6f47';
    for (let x = 0; x < L.width; x += 32) {
      if (inGap(x+16)) continue;
      const sx = x - state.cameraX;
      if (sx < -40 || sx > W) continue;
      ctx.fillRect(sx, GROUND_Y + 8, 32, H - GROUND_Y);
      // dirt texture
      ctx.fillStyle = state.levelData.bg === 'night' ? '#1f2937' : '#6b5638';
      ctx.fillRect(sx + 8, GROUND_Y + 20, 4, 4);
      ctx.fillRect(sx + 20, GROUND_Y + 32, 4, 4);
      ctx.fillStyle = state.levelData.bg === 'night' ? '#374151' : '#8b6f47';
    }
  }

  function drawPlatforms() {
    for (const pl of state.levelData.platforms) {
      const sx = pl.x - state.cameraX;
      if (sx < -pl.w || sx > W) continue;
      // Brick platform
      ctx.fillStyle = '#92400e';
      ctx.fillRect(sx, pl.y, pl.w, pl.h);
      ctx.fillStyle = '#d97706';
      ctx.fillRect(sx, pl.y, pl.w, 4);
      // Brick lines
      ctx.fillStyle = 'rgba(0,0,0,.2)';
      for (let i=0; i<pl.w; i+=20) {
        ctx.fillRect(sx + i, pl.y + 4, 1, pl.h - 4);
      }
      ctx.fillRect(sx, pl.y + 10, pl.w, 1);
    }
  }

  function drawCoins() {
    for (const c of state.coins) {
      if (c.collected) continue;
      const sx = c.x - state.cameraX;
      if (sx < -20 || sx > W) continue;
      const yoff = Math.sin(c.anim) * 4;
      const squish = Math.abs(Math.cos(c.anim * 1.5));
      const w = 8 + squish * 8;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(sx + 8, c.y + 8 + yoff, w/2, 9, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.ellipse(sx + 8, c.y + 6 + yoff, w/3, 5, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawEnemies() {
    for (const e of state.enemies) {
      const sx = e.x - state.cameraX;
      if (sx < -40 || sx > W) continue;
      if (!e.alive) {
        if (e.deadTimer <= 0) continue;
        // Squashed
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(sx, e.y + e.h - 8, e.w, 8);
        continue;
      }
      const bob = Math.sin(e.anim) * 2;
      // Body
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(sx, e.y + bob, e.w, e.h);
      // Spikes
      ctx.fillStyle = '#7f1d1d';
      for (let i=0; i<4; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + 4 + i*8, e.y + bob);
        ctx.lineTo(sx + 8 + i*8, e.y + bob - 6);
        ctx.lineTo(sx + 12 + i*8, e.y + bob);
        ctx.fill();
      }
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx + 6, e.y + 8 + bob, 6, 6);
      ctx.fillRect(sx + 20, e.y + 8 + bob, 6, 6);
      ctx.fillStyle = '#000';
      const ex = e.dir > 0 ? 2 : 0;
      ctx.fillRect(sx + 8 + ex, e.y + 10 + bob, 3, 3);
      ctx.fillRect(sx + 22 + ex, e.y + 10 + bob, 3, 3);
      // Feet
      ctx.fillStyle = '#7f1d1d';
      const fa = Math.sin(e.anim*2) * 2;
      ctx.fillRect(sx + 2, e.y + e.h + bob - 2, 8, 4 + fa);
      ctx.fillRect(sx + e.w - 10, e.y + e.h + bob - 2, 8, 4 - fa);
    }
  }

  function drawPlayer() {
    const p = state.player;
    const sx = p.x - state.cameraX;
    // Invulnerable flicker
    if (state.invulnerable > 0 && Math.floor(state.invulnerable / 5) % 2 === 0) return;
    const bob = p.onGround ? Math.sin(p.anim) * 1.5 : 0;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath();
    ctx.ellipse(sx + p.w/2, GROUND_Y - 1, p.w/2.5, 4, 0, 0, Math.PI*2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(sx, p.y + 12 + bob, p.w, p.h - 12);
    // Head
    ctx.fillStyle = '#fcd34d';
    ctx.fillRect(sx + 4, p.y + bob, p.w - 8, 14);
    // Hat
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(sx + 2, p.y - 4 + bob, p.w - 4, 6);
    ctx.fillRect(sx - 2, p.y + 2 + bob, p.w + 4, 3);
    // Eye
    ctx.fillStyle = '#000';
    const ex = p.facing > 0 ? p.w - 10 : 6;
    ctx.fillRect(sx + ex, p.y + 5 + bob, 3, 3);
    // Arms
    ctx.fillStyle = '#fcd34d';
    const arm = p.onGround ? Math.sin(p.anim) * 4 : -6;
    ctx.fillRect(sx - 3, p.y + 14 + bob + arm, 4, 8);
    ctx.fillRect(sx + p.w - 1, p.y + 14 + bob - arm, 4, 8);
    // Legs
    ctx.fillStyle = '#1e40af';
    const leg = p.onGround ? Math.sin(p.anim) * 5 : 0;
    if (p.onGround) {
      ctx.fillRect(sx + 4, p.y + p.h - 6 + bob, 8, 6 + leg);
      ctx.fillRect(sx + p.w - 12, p.y + p.h - 6 + bob, 8, 6 - leg);
    } else {
      ctx.fillRect(sx + 4, p.y + p.h - 4 + bob, 8, 6);
      ctx.fillRect(sx + p.w - 12, p.y + p.h - 4 + bob, 8, 6);
    }
  }

  function drawFlag() {
    const L = state.levelData;
    const sx = L.goal - state.cameraX;
    if (sx < -100 || sx > W + 50) return;
    // Pole
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(sx, GROUND_Y - 140, 4, 140);
    // Flag (waving)
    ctx.fillStyle = '#10b981';
    const wave = Math.sin(state.flagAnim) * 4;
    ctx.beginPath();
    ctx.moveTo(sx + 4, GROUND_Y - 140);
    ctx.lineTo(sx + 50 + wave, GROUND_Y - 128);
    ctx.lineTo(sx + 4, GROUND_Y - 116);
    ctx.fill();
    // Star on flag
    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('★', sx + 18 + wave/2, GROUND_Y - 122);
  }

  function drawParticles() {
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.min(1, pt.life / 20);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size/2, pt.y - pt.size/2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    drawBackground();
    if (state.status === 'menu') return;
    drawGround();
    drawPlatforms();
    drawCoins();
    drawFlag();
    drawEnemies();
    drawPlayer();
    drawParticles();
  }

  // Main loop
  let last = 0;
  function loop(t) {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Buttons
  $startBtn.addEventListener('click', startGame);
  $startBtn.addEventListener('touchstart', e => { e.preventDefault(); startGame(); });

  // Init background draw
  state.levelData = LEVELS[0];
  drawBackground();
})();
</script>
</body>
